name: Stale PR Management
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: bot-autoassign-stale-pr-${{ github.repository }}
  cancel-in-progress: false
jobs:
  manage-stale-prs-python:
    if: github.repository == 'openwisp/netjsonconfig'
    permissions:
      contents: read
    uses: openwisp/openwisp-actions/.github/workflows/reusable-bot-autoassign.yml@181637bcf201c137cf836f841e1ddf85df44f277 # post-0.1.1
    with:
      bot_command: stale_pr
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
